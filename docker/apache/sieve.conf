<VirtualHost *:443>
  ServerName sieve.local
  DocumentRoot /var/www/sieve

  SSLEngine on
  SSLCertificateFile /etc/apache2/certs/tls.crt
  SSLCertificateKeyFile /etc/apache2/certs/tls.key

  Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: ws:"

  <Location "/">
    SetOutputFilter RATE_LIMIT
    SetEnv rate-limit 400
  </Location>

  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"

  ProxyPass /config.json http://127.0.0.1:8765/config.json
  ProxyPassReverse /config.json http://127.0.0.1:8765/config.json
  ProxyPass /websocket/ ws://127.0.0.1:8765/websocket/
  ProxyPassReverse /websocket/ ws://127.0.0.1:8765/websocket/

  <Directory /var/www/sieve>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /app.html
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/sieve-error.log
  CustomLog ${APACHE_LOG_DIR}/sieve-access.log combined
</VirtualHost>
