name: CI

on:
  push:
    branches: [master, main, websieve]
  pull_request:
    branches: [master, main, websieve]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean workspace
        run: npm run gulp clean

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TEST-sieve.xml

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image-name
        run: |
          REPO="${{ github.repository }}"
          REPO_LC="${REPO,,}"
          echo "REPO_LC=${REPO_LC}" >> $GITHUB_ENV
          echo "IMAGE_NAME=ghcr.io/${REPO_LC}/${REPO}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name sieve-smoke -p 8443:443 \
            -e DOVECOT_HOST=127.0.0.1 \
            -e DOVECOT_PORT=4190 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 5
          curl -k -f https://localhost:8443/config.json || (docker logs sieve-smoke && exit 1)
          docker stop sieve-smoke
